name: freesub-autosync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run autosync
        run: python3 sync_fork.py
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FORK: tthhjkk/freesub-
          UPSTREAM: hezhanleiok/freesub
          SUFFIX: github
          WORKFLOW_ID: 361298492
          CUSTOM_SOURCES: custom-sources.txt

